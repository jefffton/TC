<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Case Analyzer</title>
  <style>
    :root { --primary: #0972d3; --primary-dark: #033160; --primary-light: #e9f3ff; --success: #037f0c; --warning: #8d6605; --danger: #d91515; --bg: #f2f3f3; --card: #ffffff; --text: #000716; --muted: #5f6b7a; --border: #d1d5db; --header-bg: #232f3e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    .topbar { background: var(--header-bg); padding: 0.6rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .topbar h1 { color: #fff; font-size: 1rem; font-weight: 700; }
    .container { max-width: 1280px; margin: 0 auto; padding: 1.25rem 2rem; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
    .panel-header { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .panel-body { padding: 1rem; }
    .btn { padding: 0.4rem 0.85rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: white; color: var(--text); transition: all 0.1s; }
    .btn:hover { background: #f3f3f3; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .upload-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 2.5rem; text-align: center; cursor: pointer; transition: all 0.15s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
    .upload-zone p { color: var(--muted); font-size: 0.85rem; }
    .upload-zone .icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .upload-zone .browse { color: var(--primary); font-weight: 600; text-decoration: underline; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.75rem; }
    .metric { text-align: center; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: #fafafa; }
    .metric .val { font-size: 1.5rem; font-weight: 700; }
    .metric .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 0.1rem; }
    .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .toolbar select, .toolbar input { padding: 0.35rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; }
    .toolbar select { min-width: 120px; }
    .tc-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .tc-table th { text-align: left; padding: 0.5rem 0.6rem; background: #f9fafb; border-bottom: 2px solid var(--border); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--muted); }
    .tc-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid #f1f3f5; vertical-align: top; }
    .tc-table tr { cursor: pointer; transition: background 0.1s; }
    .tc-table tr:hover { background: #f7f9fb; }
    .tc-table tr.expanded { background: var(--primary-light); }
    .score-pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-weight: 700; font-size: 0.75rem; color: white; }
    .pill-high { background: var(--success); }
    .pill-mid { background: var(--warning); }
    .pill-low { background: var(--danger); }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.7rem; font-weight: 600; margin-left: 0.3rem; }
    .badge-ai { background: #f3e8ff; color: #6b21a8; }
    .badge-grade { background: #f1f5f9; color: var(--muted); }
    .detail-row { display: none; }
    .detail-row.visible { display: table-row; }
    .detail-row td { padding: 0.75rem 1rem; background: #fafbfc; }
    .detail-content { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .detail-section h5 { font-size: 0.8rem; color: var(--primary-dark); margin-bottom: 0.3rem; }
    .detail-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; font-size: 0.8rem; }
    .detail-bar .bar-bg { flex: 1; max-width: 80px; height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
    .detail-bar .bar-fill { height: 100%; border-radius: 3px; }
    .detail-bar .score { font-weight: 600; width: 30px; text-align: right; }
    .suggestion-list { font-size: 0.8rem; color: #6b4400; padding-left: 1rem; margin-top: 0.3rem; }
    .suggestion-list li { margin-bottom: 0.15rem; }
    .rewrite-box { margin-top: 0.5rem; padding: 0.5rem; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 4px; font-size: 0.78rem; }
    .rewrite-box h6 { color: #3730a3; margin-bottom: 0.3rem; }
    .rewrite-box ol { padding-left: 1rem; }
    .rewrite-box li { margin-bottom: 0.2rem; }
    .rewrite-box .reason { color: var(--muted); font-style: italic; font-size: 0.7rem; }
    .pass-badge { color: var(--success); font-size: 0.8rem; }
    #results { display: none; }
    @media (max-width: 768px) { .container { padding: 1rem; } .metrics { grid-template-columns: 1fr 1fr 1fr; } .detail-content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar"><h1>Test Case Analyzer</h1></div>
  <div class="container">
    <!-- Upload -->
    <div class="panel" id="upload-panel">
      <div class="panel-body">
        <div class="upload-zone" id="upload-zone">
          <div class="icon">📄</div>
          <p><strong>Drop your file here</strong> or <span class="browse">browse</span></p>
          <p>.xlsx, .xls, .csv — auto-analyzes on upload</p>
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleFileSelect(event)">
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="results">
      <div class="panel">
        <div class="panel-header"><span>Summary</span><div class="btn-group"><button class="btn" onclick="exportToCSV()">Export CSV</button></div></div>
        <div class="panel-body"><div id="metrics" class="metrics"></div></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span>Test Cases</span><span id="result-count" style="font-weight:normal;color:var(--muted)"></span></div>
        <div class="panel-body">
          <div class="toolbar" id="toolbar"></div>
          <table class="tc-table"><thead><tr><th>ID</th><th>Title</th><th>Score</th><th>Grade</th><th>Issues</th></tr></thead><tbody id="tc-body"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="analyzer.js"></script>
  <script src="ui.js"></script>
</body>
</html>
